[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "instructor>=1.4.0",
    "httpx>=0.27.0",
    "playwright>=1.45.0",
    "trafilatura>=1.12.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "langsmith>=0.1.0",
    "streamlit>=1.36.0",
    "tenacity>=8.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
